  gost_tu_ost:
    if_present: extract_and_compare
    if_missing: manual_review_not_reject
hard_filters:
  auto_reject:
  - rule_id: REJ_001
    condition: предмет закупки относится к сбору, приему, реализации, продаже или утилизации алюминиевого лома
    action: reject
    reason: лом и металлолом не являются целевым направлением поставки алюминиевого проката
  - rule_id: REJ_002
    condition: предмет закупки не связан с алюминием или алюминиевым прокатом
    action: reject
    reason: нет совпадения с продуктовой матрицей и ключевыми словами
  - rule_id: REJ_003
    condition: требуется только монтаж, демонтаж, ремонт, установка окон, радиаторов, вывесок или табличек без поставки алюминиевого
      проката
    action: reject
    reason: закупка относится к услугам/готовым изделиям вне продуктовой матрицы
  - rule_id: REJ_004
    condition: невозможно определить предмет закупки даже после анализа документов
    action: reject
    reason: нет данных для расчета и сопоставления
  - rule_id: REJ_005
    condition: размеры продукции явно выходят за диапазоны product_matrix и нет допуска эквивалента/аналога
    action: reject_or_manual_review
    reason: техническое несоответствие продуктовой матрице
  - rule_id: REJ_006
    condition: количество меньше 500 кг и нет стратегической причины рассматривать тендер
    action: reject_or_low_priority
    reason: ниже минимального коммерческого объема
  manual_review:
  - rule_id: MR_001
    condition: не указан сплав
    reason: нельзя уверенно сопоставить с product_matrix
  - rule_id: MR_002
    condition: не указаны толщина/ширина/длина/количество
    reason: не хватает данных для расчета
  - rule_id: MR_003
    condition: есть чертежи или требование изготовления по чертежам
    reason: нужно согласование производства
  - rule_id: MR_004
    condition: НМЦК отсутствует
    reason: не отклонять; нужно коммерческое решение специалиста
  - rule_id: MR_005
    condition: условия оплаты отсутствуют или нестандартные
    reason: нужна проверка договора
  - rule_id: MR_006
    condition: ГОЗ, режимный объект или специальные требования приемки
    reason: нужна юридическая/тендерная проверка
  - rule_id: MR_007
    condition: сплав найден только как импортный или неоднозначный аналог
    reason: нужно подтверждение аналога
  - rule_id: MR_008
    condition: несколько номенклатур в одном тендере
    reason: проверять каждую позицию отдельно
  positive_signals:
  - condition: продукт, сплав и размеры входят в product_matrix
  - condition: объем от 500 кг
  - condition: сумма договора от 1 млн руб
  - condition: есть аванс
  - condition: нет обеспечения заявки и договора
  - condition: 'срок поставки реалистичный: от 10 до 90 дней'
  - condition: закупка напрямую за лучшую цену
  - condition: крупный промышленный заказчик, использующий алюминий
scoring:
  max_score: 100
  weights:
    keyword_relevance: 10
    product_type_match: 15
    alloy_match: 15
    dimension_match: 15
    quantity_and_batch_match: 10
    documentation_completeness: 10
    delivery_feasibility: 10
    financial_attractiveness: 10
    risk_and_stop_factors: 5
  details:
    keyword_relevance:
    - points: 10
      condition: найдено точное ключевое слово и нет stop_keyword
    - points: 5
      condition: найдено косвенное ключевое слово
    - points: 0
      condition: ключевые слова не найдены
    product_type_match:
    - points: 15
      condition: тип продукции найден в product_matrix
    - points: 8
      condition: тип продукции похож на product_matrix, нужен мэппинг
    - points: 0
      condition: тип продукции не найден
    alloy_match:
    - points: 15
      condition: сплав найден в product_matrix для указанного product_type
    - points: 8
      condition: сплав указан, но требует нормализации или аналога
    - points: 4
      condition: сплав не указан, но продукт подходит
    - points: 0
      condition: сплав явно неподходящий
    dimension_match:
    - points: 15
      condition: толщина и ширина в диапазоне product_matrix
    - points: 8
      condition: часть размеров отсутствует
    - points: 4
      condition: размеры на границе диапазона
    - points: 0
      condition: размеры вне диапазона
    quantity_and_batch_match:
    - points: 10
      condition: количество >= 500 кг
    - points: 5
      condition: количество не указано
    - points: 2
      condition: количество < 500 кг, но заказчик стратегический
    - points: 0
      condition: количество < 500 кг без стратегической причины
    documentation_completeness:
    - points: 10
      condition: есть ТЗ/спецификация/договор/сроки/место поставки
    - points: 5
      condition: есть ТЗ, но не хватает части данных
    - points: 0
      condition: нет ТЗ или невозможно определить предмет
    delivery_feasibility:
    - points: 10
      condition: срок поставки 10-90 дней или поставка партиями
    - points: 6
      condition: срок поставки не указан
    - points: 4
      condition: срок поставки менее 10 дней
    - points: 0
      condition: срок явно невозможен
    financial_attractiveness:
    - points: 10
      condition: сумма >= 1 млн руб или хороший объем
    - points: 7
      condition: сумма 500 тыс - 1 млн руб
    - points: 5
      condition: НМЦК отсутствует, но продукт и объем подходят
    - points: 3
      condition: длинная постоплата 45-90 дней
    - points: 0
      condition: экономически нецелесообразно
    risk_and_stop_factors:
    - points: 5
      condition: нет стоп-факторов
    - points: 3
      condition: есть средние риски, нужна ручная проверка
    - points: 0
      condition: есть критический стоп-фактор
decision_thresholds:
  participate_candidate:
    min_score: 75
    max_score: 100
    action: recommend_participation_or_commercial_calculation
    final_decision_owner: tender_specialist
  manual_review:
    min_score: 50
    max_score: 74
    action: send_to_tender_specialist
    final_decision_owner: tender_specialist
  reject_or_low_priority:
    min_score: 0
    max_score: 49
    action: reject_or_mark_low_priority
    final_decision_owner: tender_specialist
  force_manual_review_conditions:
  - missing_payment_terms
  - missing_alloy
  - drawings_present
  - nmck_missing
  - multiple_positions
  - GOZ_or_special_acceptance
  force_reject_conditions:
  - stop_keyword_lom_without_product_match
  - not_aluminum_related
  - service_only_without_product_supply
output:
  forms_otchet_fields: *id001
  assistant_response_blocks:
  - краткое резюме тендера
  - извлеченные параметры продукции
  - совпадение с product_matrix
  - ключевые слова и стоп-слова
  - финансовые условия
  - логистика и сроки
  - недостающие данные
  - риски
  - score
  - рекомендация
  - что проверить специалисту
  decision_values:
  - participate_candidate
  - manual_review
  - reject_or_low_priority
  risk_values:
  - low
  - medium
  - high
  - critical
