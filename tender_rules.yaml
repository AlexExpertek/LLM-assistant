metadata:
  name: tender_rules
  version: 1.0.0
  created_at: '2026-07-02'
  language: ru
  purpose: Фильтрация, оценка и разметка тендеров по алюминиевому прокату для RAG/MVP тендерного ассистента.
  source_files:
  - forms_otchet (1).xlsx
  - example_accepted 1.xlsx
  - key_words_al (1).xlsx
  - product_matrix (1).xlsx
  - tender_rules.xlsx
  important_note: Ассистент не принимает финальное коммерческое решение за тендерного специалиста; он заполняет отчет, присваивает
    score, выявляет риски и рекомендует действие.
scope:
  allowed_procurement_laws:
  - 44-ФЗ
  - 223-ФЗ
  - коммерческие закупки
  allowed_regions:
  - Российская Федерация
  - СНГ
  allowed_customers: все заказчики, которые используют алюминий или алюминиевый прокат
  allowed_industries: все отрасли
  okpd2_include_prefixes:
  - 24.42.22
  - 24.42.23
  - 24.42.24
  - 24.42.25
  - 24.42.26
  - 24.42.11
  nmck_required: false
  advance_required: false
  security_can_be_any_value: true
  procurement_method: любой способ закупки/отбора
input_processing:
  supported_file_types:
  - pdf
  - doc
  - docx
  - xls
  - xlsx
  - jpg
  - jpeg
  - png
  - html
  - zip
  required_pipeline_steps:
  - download_or_receive_tender_documents
  - extract_text_and_tables_from_documents
  - extract_product_parameters
  - match_keywords_and_stop_keywords
  - match_product_matrix
  - apply_hard_filters
  - calculate_scoring
  - fill_forms_otchet_schema
  - return_decision_and_explanation
  ocr_required_for_images: true
  rag_search_collections:
  - product_matrix
  - key_words_al
  - tender_examples
  - risk_rules
  - selection_rules
normalization:
  case_insensitive: true
  trim_spaces: true
  normalize_decimal_separator:
    from: ','
    to: .
  normalize_units:
    thickness: mm
    width: mm
    length: mm
    quantity: kg
    delivery_time: days
  alloy_normalization_rules:
  - from: 1050А
    to: 1050A
    reason: кириллическая А заменяется на латинскую A
  - from: Ад1
    to: АД1
  - from: Ад0
    to: АД0
  - from: Амц
    to: АМц
  - from: Амг
    to: АМг
  product_type_synonyms:
    лента:
    - алюминиевая лента
    - лента алюминиевая
    - лента из алюминиевого сплава
    штрипсы:
    - штрипс
    - штрипсы алюминиевые
    - полоса алюминиевая
    - алюминиевая полоса
    рулон:
    - рулон алюминиевый
    - алюминий в рулоне
    - рулонный алюминий
    лист:
    - лист алюминиевый
    - алюминиевый лист
    плита:
    - плита алюминиевая
    - алюминиевая плита
    фольга:
    - алюминиевая фольга
    - фольга алюминиевая
    лента тисненная:
    - лента тисненая
    - лента тисненная
    - рифленая лента
    - тисненая алюминиевая лента
