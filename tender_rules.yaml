    strong_match:
    - product_type_found
    - alloy_found_in_product_matrix
    - dimensions_inside_range
    - quantity_kg_greater_or_equal_min_batch
    partial_match:
    - product_type_found
    - missing_alloy_or_dimensions
    - quantity_unknown_or_below_min_batch
    no_match:
    - product_type_not_found
    - alloy_not_found_and_no_close_analogue
    - dimensions_outside_range
financial_rules:
  min_contract_value_rub_for_consideration: 500000
  preferred_contract_value_rub: 1000000
  nmck_missing_action: manual_review_not_reject
  advance_payment: any
  payment_terms_logic:
  - condition: аванс есть
    score_effect: positive
  - condition: оплата 45-75 календарных дней после подписания накладных
    score_effect: allowed_with_medium_risk
    source_example: Роснефть accepted case
  - condition: постоплата более 90 календарных дней
    score_effect: high_risk_manual_review
  - condition: условия оплаты отсутствуют
    score_effect: manual_review
  security_rules:
    application_security: any_value_allowed_but_extract_to_report
    contract_security: any_value_allowed_but_extract_to_report
    no_security: positive_signal
delivery_rules:
  standard_product_matrix_delivery_days:
  - 10
  - 20
  accepted_example_delivery_patterns:
  - 20 календарных дней с даты подачи заявки
  - 30/60/90 дней партиями
  - после 10 дней после подписания
  manual_review_if_delivery_missing: true
  manual_review_if_delivery_less_than_days: 10
  positive_if_delivery_between_days:
  - 10
  - 90
  delivery_by_supplier_allowed: true
  partial_delivery_allowed_if_documentation_allows: true
