implementation_notes_for_developer:
- Product_matrix должна использоваться как структурированная таблица/SQL, а не только как RAG-текст.
- Key_words_al используется для первичного поиска и расширения запроса.
- Stop_keywords применяются до scoring, но при наличии сильного product_matrix match переводят тендер в manual_review, а не
  всегда в reject.
- Каждую номенклатурную позицию внутри тендера нужно анализировать отдельно.
- Финальный статус участвовать/не участвовать подтверждает тендерный специалист.
